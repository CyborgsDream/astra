name: ASTRA CITY Browser Evidence

on:
  push:
    paths:
      - "games/astra-city/**"
      - ".github/workflows/astra-city-browser.yml"
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/astra-city
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/astra-city/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Linux WebGPU software stack
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Run headed WebGPU evidence under Xvfb
        env:
          ASTRA_HEADFUL: "1"
          ASTRA_SWIFTSHADER: "1"
        run: xvfb-run -a npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-city-browser-evidence
          path: games/astra-city/test-results
          if-no-files-found: warn
