name: ASTRA CITY CI

on:
  push:
    paths:
      - "games/astra-city/**"
      - ".github/workflows/astra-city-ci.yml"
  pull_request:
    paths:
      - "games/astra-city/**"
      - ".github/workflows/astra-city-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/astra-city
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/astra-city/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:district
      - run: npm run build
